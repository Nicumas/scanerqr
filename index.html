<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сканировать QR-чек</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      position: fixed;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      /* Зеркальное отображение УБРАНО */
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding-top: 20px;
      background: rgba(0,0,0,0.6);
      pointer-events: none;
    }

    #msg {
      font-size: 1.5em;
      color: #fff;
      text-align: center;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 10px;
      margin-top: 20px;
      font-weight: 500;
    }

    .hidden {
      display: none;
    }
    
    .header {
      color: white;
      font-size: 1.8em;
      text-align: center;
      margin-top: 30px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    
    .coffee-icon {
      font-size: 1.5em;
      margin-right: 10px;
    }
    
    video::-webkit-media-controls {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Кнопка запуска УДАЛЕНА -->
  <video id="video" autoplay muted playsinline></video>
  <div id="overlay">
    <div class="header"><span class="coffee-icon">☕</span> Сканируйте QR-чек</div>
    <div id="msg">Наведите камеру на QR-код в чеке</div>
  </div>

  <script>
    const video = document.getElementById('video');
    const msg = document.getElementById('msg');
    const overlay = document.getElementById('overlay');

    // Автоматический запуск камеры при загрузке
    window.addEventListener("load", async () => {
      if (window.Telegram?.WebApp) {
        Telegram.WebApp.ready();
      }
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: "environment", 
            width: { min: 640, ideal: 1280 }, 
            height: { min: 480, ideal: 720 } 
          }
        });
        
        video.srcObject = stream;
        
        video.play().catch(e => {
          console.log("Video play error:", e);
          msg.textContent = "❌ Ошибка запуска камеры";
        });
        
        video.onloadedmetadata = () => {
          requestAnimationFrame(scanFrame);
        };
        
      } catch (err) {
        console.error('Camera error:', err);
        msg.textContent = '🚫 Ошибка доступа к камере';
      }
    });

    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    let scanActive = true;

    function scanFrame() {
      if (!scanActive) return;
      
      if (video.readyState >= video.HAVE_METADATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        context.clearRect(0, 0, canvas.width, canvas.height);
        // Рисуем изображение БЕЗ зеркального отражения
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imgData = context.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, canvas.width, canvas.height, {
          inversionAttempts: "dontInvert",
        });

        if (code) {
          scanActive = false;
          msg.textContent = "✅ Чек распознан!";
          
          // Для чеков нам нужна строка, начинающаяся с "t="
          if (code.data.startsWith("t=")) {
            if (window.Telegram?.WebApp) {
              Telegram.WebApp.sendData(code.data);
            } else {
              msg.textContent = `QR-код: ${code.data}`;
              setTimeout(() => scanActive = true, 2000);
            }
          } else {
            msg.textContent = "❌ Это не QR-чек";
            setTimeout(() => scanActive = true, 2000);
          }
        }
      }
      if (scanActive) {
        requestAnimationFrame(scanFrame);
      }
    }

    // Предотвращаем появление стандартных элементов управления видео
    video.addEventListener('contextmenu', e => e.preventDefault());
    video.controls = false;
  </script>
</body>
</html>
