<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сканер QR-чека</title>
  <style>
    :root {
      --bg-color: #f6f2ec;
      --accent-color: #6f4e37;
      --text-color: #3b2e2a;
      --button-color: #a9745b;
      --button-hover: #8b5e45;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      color: var(--accent-color);
      font-size: 1.6em;
      margin-bottom: 0.8em;
    }

    #scanner-container {
      width: 320px;
      max-width: 90vw;
      height: 320px;
      border: 4px solid var(--accent-color);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      margin: 1em 0;
    }

    #result {
      margin-top: 0.6em;
      font-size: 1.05em;
      text-align: center;
      min-height: 1.8em;
      max-width: 90vw;
      word-break: break-word;
    }

    .btn {
      background-color: var(--button-color);
      border: none;
      color: white;
      padding: 12px 24px;
      text-align: center;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 0.5em 0;
      width: 320px;
      max-width: 90vw;
      box-sizing: border-box;
    }

    .btn:hover {
      background-color: var(--button-hover);
    }
  </style>
</head>
<body>
  <h1>Сканируйте QR-чек</h1>
  <button class="btn" onclick="startScanner()">Отсканировать</button>
  <div id="scanner-container"></div>
  <div id="result">Наведите камеру на QR-код чека</div>

  <script src="https://unpkg.com/html5-qrcode@2.3.7"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    let html5QrCode = null;
    let scanning = false;
    const REQUIRED_KEYS = ["t", "s", "fn", "i", "fp", "n"];

    function normalizeReceiptQuery(queryString) {
      try {
        const params = new URLSearchParams(queryString);
        const normalized = new URLSearchParams();

        for (const key of REQUIRED_KEYS) {
          let value = params.get(key);
          if (!value && key === "i") {
            value = params.get("fd");
          }
          if (!value) {
            return null;
          }
          normalized.set(key, value);
        }
        return normalized.toString();
      } catch (_) {
        return null;
      }
    }

    function extractReceiptPayload(rawValue) {
      if (!rawValue) return null;
      const value = String(rawValue).trim();
      if (!value) return null;

      if (value.startsWith("t=")) {
        return normalizeReceiptQuery(value);
      }

      if (value.startsWith("http://") || value.startsWith("https://")) {
        try {
          const url = new URL(value);
          const fromUrl = normalizeReceiptQuery(url.search.slice(1));
          if (fromUrl) return fromUrl;
        } catch (_) {}
      }

      if (value.includes("?")) {
        const fromQuestion = normalizeReceiptQuery(value.split("?", 2)[1]);
        if (fromQuestion) return fromQuestion;
      }

      if (value.startsWith("qr=")) {
        try {
          const decoded = decodeURIComponent(value.slice(3));
          return extractReceiptPayload(decoded);
        } catch (_) {}
      }

      try {
        const obj = JSON.parse(value);
        if (obj && typeof obj === "object") {
          const normalized = new URLSearchParams();
          for (const key of REQUIRED_KEYS) {
            let field = obj[key];
            if (!field && key === "i") {
              field = obj.fd;
            }
            if (!field) {
              return null;
            }
            normalized.set(key, String(field));
          }
          return normalized.toString();
        }
      } catch (_) {}

      return null;
    }

    async function startScanner() {
      if (scanning && html5QrCode) {
        await html5QrCode.stop().catch(() => {});
      }

      scanning = true;
      document.getElementById("result").innerText = "Подготовка камеры...";

      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
      }

      html5QrCode = new Html5Qrcode("scanner-container");
      const config = { fps: 10, qrbox: 250 };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          const payload = extractReceiptPayload(decodedText);
          if (!payload) {
            document.getElementById("result").innerText = "Это не QR-чек ФНС, сканирую дальше...";
            return;
          }

          document.getElementById("result").innerText = "Чек распознан, отправляю в бот...";
          html5QrCode.stop().catch(() => {});
          scanning = false;

          if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.sendData(payload);
            return;
          }

          document.getElementById("result").innerText = `Распознан чек: ${payload}`;
        },
        () => {
          document.getElementById("result").innerText = "Сканирую...";
        }
      ).catch((err) => {
        document.getElementById("result").innerText = `Ошибка камеры: ${err}`;
        scanning = false;
      });
    }
  </script>
</body>
</html>
